<!DOCTYPE html>
<html>
  <head>
    <title>Vue Example</title>
    <script src="https://unpkg.com/vue@3"></script>
  </head>
  <body>
    <div id="app">
      <h1>Hello {{ name }}!</h1>
      <input v-model="name" placeholder="Andika izina...">
    </div>

    <script>
      const app = Vue.createApp({
        data() {
          return {
            name: "Benjamin"
          };
        }
      });
      app.mount("#app");
    </script>
